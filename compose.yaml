name: redi

services:
  redmine-for-test-6.1:
    image: redmine:6.1
    ports:
      - 3061:3000

  redmine-for-test-7.0:
    image: redmine:7.0
    ports:
      - 3070:3000

  redmine-for-dogfooding:
    image: redmine:7.0
    profiles:
      - dogfooding
    restart: always
    ports:
      - 3001:3000
    volumes:
      - redmine-dogfooding-files:/usr/src/redmine/files
      - redmine-dogfooding-sqlite:/usr/src/redmine/sqlite

  # デモ用は言語ごとに分ける。ステータス/トラッカー/優先度は Redmine 全体の設定で
  # プロジェクト単位に名前を変えられないため、1 インスタンスでは英日を両立できない。
  redmine-for-demo-en:
    profiles:
      - demo
    image: redmine:6.1
    ports:
      - 3002:3000

  redmine-for-demo-ja:
    profiles:
      - demo
    image: redmine:6.1
    ports:
      - 3003:3000

volumes:
  redmine-dogfooding-files:
  redmine-dogfooding-sqlite:
