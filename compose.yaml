name: redi

services:
  redmine-for-test-61:
    image: redmine:6.1
    ports:
      - 3061:3000

  redmine-for-test-70:
    image: redmine:7.0
    ports:
      - 3070:3000

  redmine-for-dogfooding:
    image: redmine:6.1
    profiles:
      - dogfooding
    restart: always
    ports:
      - 3001:3000
    volumes:
      - redmine-dogfooding-files:/usr/src/redmine/files
      - redmine-dogfooding-sqlite:/usr/src/redmine/sqlite

  redmine-for-demo:
    profiles:
      - demo
    image: redmine:6.1
    ports:
      - 3002:3000

volumes:
  redmine-dogfooding-files:
  redmine-dogfooding-sqlite:
