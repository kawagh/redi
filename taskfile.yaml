version: '3'

tasks:
  default:
    desc: list tasks
    cmds:
      - task --list-all --sort none

  check:
    desc: format, lint, typecheck, test
    cmds:
      - task: format
      - task: lint
      - task: typecheck
      - task: test

  format:
    desc: format
    cmds:
      - uv run ruff format
      - task: format:site

  format:site:
    desc: format site (astro / ts / css)
    dir: site
    cmds:
      - pnpm exec biome format . --write

  lint:
    desc: lint
    cmds:
      - uv run ruff check

  typecheck:
    desc: typecheck
    cmds:
      - uv run ty check

  test:
    desc: run tests (except E2E)
    cmds:
      - uv run pytest -v --cov=src/redi

  test:e2e:
    desc: run E2E tests (all target Redmine versions)
    cmds:
      - task: test:e2e:6.1
      - task: test:e2e:7.0

  test:e2e:6.1:
    desc: run E2E tests against Redmine 6.1
    cmds:
      - task: e2e
        vars: { REDMINE_VERSION: '6.1' }

  test:e2e:7.0:
    desc: run E2E tests against Redmine 7.0
    cmds:
      - task: e2e
        vars: { REDMINE_VERSION: '7.0' }

  e2e:
    internal: true
    cmds:
      - ./script/init-redmine.sh {{.REDMINE_VERSION}}
      - REDI_E2E_REDMINE_VERSION={{.REDMINE_VERSION}} uv run pytest -m e2e

  release:
    desc: release next version
    prompt: リリースしますか?
    cmds:
      - git switch develop
      - git pull
      - task: check
      - git diff --quiet # 未ステージ
      - git diff --cached --quiet # 未コミット
      - uv version --bump patch
      - git add pyproject.toml uv.lock
      - git commit -m "version $(uv version --short)"
      - git tag "$(uv version --short)"
      - git push
      - git push --tags

  demo:
    desc: generate demo
    summary: |
      vhs(https://github.com/charmbracelet/vhs)を使って デモ用のgifを生成する
      ./doc/demo.tape ->  ./doc/demo.gif
    cmds:
      - bash ./script/init-redmine-demo.sh
      - vhs ./doc/demo.tape

  demo:site:
    desc: generate site images
    summary: |
      vhs(https://github.com/charmbracelet/vhs)を使って ドキュメントサイト用の
      TUI の GIF / 静止画を生成する
      ./doc/tape/tui-en.tape -> ./site/public/img/*-en.{gif,png}
      ./doc/tape/tui-ja.tape -> ./site/public/img/*-ja.{gif,png}
      ./doc/tape/init-*.tape.template -> ./site/public/img/init-*.gif
    cmds:
      - bash ./script/init-redmine-demo.sh
      - vhs ./doc/tape/tui-en.tape
      - vhs ./doc/tape/tui-ja.tape
      - bash ./script/record-init-demo.sh

  rulesync:
    desc: sync skills
    cmds:
      - rulesync generate -t agentsmd,claudecode -f skills --simulate-skills
