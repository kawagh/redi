[project]
name = "redtile"
version = "0.0.47"
description = "Redmine CLI/TUI tool that wraps the Redmine REST API"
readme = "README.md"
authors = [
    { name = "kawagh", email = "kawagh.dev@gmail.com" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["redmine"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "argcomplete>=3.6.3",
    "prompt-toolkit>=3.0.52",
    "requests>=2.33.1",
    "tomlkit>=0.14.0",
    "wcwidth>=0.2.13",
]

[project.urls]
Repository = "https://github.com/kawagh/redi"

[project.scripts]
redi = "redi.cli.main:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
    "ty>=0.0.31",
]

[tool.uv.build-backend]
module-name = "redi"

[tool.ruff.lint]
# ruff 0.16 で拡張されたデフォルトルールのうち、既存コードに適合しないものを除外する
ignore = [
  "PLR1722", # exit() の使用を許容する
  "I001",    # import の並び順を強制しない
  "DTZ",     # tz を持たない date/datetime の生成を許容する
  "B006",    # ミュータブルなデフォルト引数を許容する
  "PLW1510", # subprocess.run() への check 指定を必須としない
  "SIM114",  # 同一処理となる分岐の統合を必須としない
  "PIE807",  # lambda: [] の使用を許容する
  "FURB122", # ループ内の write() を writelines() にまとめない
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "e2e: E2E test (needs Redmine initialized by script/init-redmine.sh)",
]
addopts = "-m 'not e2e'"
