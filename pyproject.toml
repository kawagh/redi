[project]
name = "redtile"
version = "0.0.55"
description = "Redmine CLI/TUI tool that wraps the Redmine REST API"
readme = "README.md"
authors = [
    { name = "kawagh", email = "kawagh.dev@gmail.com" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["redmine"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "argcomplete>=3.6.3",
    "prompt-toolkit>=3.0.52",
    "requests>=2.33.1",
    "tomlkit>=0.14.0",
    "wcwidth>=0.2.13",
]

[project.urls]
Repository = "https://github.com/kawagh/redi"

[project.scripts]
redi = "redi.cli.main:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
    "ty>=0.0.31",
]

[tool.uv.build-backend]
module-name = "redi"

[tool.ruff.lint]
ignore = [
  # タイムゾーンを意識した実装はしないので許容する
  "DTZ005", # datetime.now() を tz なしで呼ぶことを許容する
  "DTZ011", # date.today() の使用を許容する
  # 副作用のある式をif で重ねて書くと読みにくいため
  "SIM102", # ネストした if を and でまとめることを強制しない
  "SIM114", # 同じ本体を持つ分岐を or でまとめることを強制しない
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "e2e: E2E test (needs Redmine initialized by script/init-redmine.sh)",
]
addopts = "-m 'not e2e'"
